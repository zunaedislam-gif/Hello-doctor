name: hello_doctor
description: "A professional multi-role telemedicine application skeleton."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State Management
  provider: ^6.1.2

  # Persistent Storage
  shared_preferences: ^2.2.2

  # Network API
  http: ^1.2.0

  # Image Selection
  image_picker: ^1.0.7

  # Local Notifications
  flutter_local_notifications: ^17.0.0

  # Typography (Google Fonts)
  google_fonts: ^6.1.0

  # Charts
  fl_chart: ^0.66.0

  # PDF and Printing
  pdf: ^3.11.0
  printing: ^5.11.1

  # Video Consultation & Free Signaling (WebRTC + Firebase RTDB)
  flutter_webrtc: ^0.10.4
  permission_handler: ^11.3.0
  firebase_core: ^2.27.0
  firebase_database: ^10.4.0
  cloud_firestore: ^4.15.5
  video_player: ^2.8.2
  file_picker: ^8.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.jpg
